# Publica o site no GitHub Pages a partir do Azure DevOps.
#
# Pré-requisitos (uma vez):
# 1. Repo público no GitHub (ex.: seu-usuario/sanavita-site)
# 2. PAT do GitHub com permissão "Contents: Read and write" (fine-grained)
#    ou "repo" (classic) — salvar como variável secreta GITHUB_PAT
# 3. No GitHub: Settings → Pages → Source = Deploy from a branch → gh-pages / (root)
# 4. No Azure DevOps: Pipeline variables (ou Variable Group):
#      GITHUB_REPO   = usuario/sanavita-site
#      GITHUB_PAT    = *** (secret)
#      GITHUB_BRANCH = gh-pages   (opcional; default gh-pages)

trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  githubBranch: $[coalesce(variables['GITHUB_BRANCH'], 'gh-pages')]

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: 'Node.js $(nodeVersion)'
    inputs:
      versionSpec: $(nodeVersion)

  - script: npm ci
    displayName: 'Instalar dependências'

  - script: npm run build
    displayName: 'Build do site'
    env:
      # Ativa base "/<repo>/" no vite.config.ts
      GITHUB_ACTIONS: 'true'
      GITHUB_REPOSITORY: $(GITHUB_REPO)

  - script: |
      set -euo pipefail

      if [ -z "${GITHUB_REPO:-}" ] || [ -z "${GITHUB_PAT:-}" ]; then
        echo "##vso[task.logissue type=error]Defina as variáveis GITHUB_REPO e GITHUB_PAT no pipeline."
        exit 1
      fi

      REPO_URL="https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPO}.git"
      BRANCH="${GITHUB_BRANCH:-gh-pages}"

      # Página vazia evita 404 do GitHub em pastas sem index
      touch dist/.nojekyll

      cd dist
      git init -b "$BRANCH"
      git config user.name "Azure DevOps"
      git config user.email "azure-pipelines@users.noreply.github.com"
      git add -A
      git commit -m "Deploy site from Azure Pipelines $(Build.BuildNumber)"
      git push --force "$REPO_URL" "HEAD:${BRANCH}"

      echo "Publicado em https://$(echo "$GITHUB_REPO" | cut -d/ -f1).github.io/$(echo "$GITHUB_REPO" | cut -d/ -f2)/"
    displayName: 'Publicar no GitHub Pages (branch gh-pages)'
    env:
      GITHUB_REPO: $(GITHUB_REPO)
      GITHUB_PAT: $(GITHUB_PAT)
      GITHUB_BRANCH: $(githubBranch)
